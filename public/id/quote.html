<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minta Penawaran Kargo Udara — PT Ambara Artha Globaltrans</title>
  <meta name="description" content="Kirim detail pengiriman Anda untuk mendapatkan penawaran kargo udara dari atau menuju Indonesia bersama Ambara Artha.">
  <link rel="canonical" href="https://www.ambaraartha.com/id/quote">
  <link rel="alternate" hreflang="en" href="https://www.ambaraartha.com/en/quote">
  <link rel="alternate" hreflang="id" href="https://www.ambaraartha.com/id/quote">
  <link rel="alternate" hreflang="x-default" href="https://www.ambaraartha.com/en/quote">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    @media (max-width: 640px) {
      #quote-form [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
<div id="navbar-mount"></div>

<section style="padding-top:120px;padding-bottom:60px">
  <div class="container" style="max-width:800px">
    <div style="text-align:center;margin-bottom:48px">
      <div class="section-label">Penawaran</div>
      <h1 style="font-size:clamp(2rem,4vw,3rem);margin-bottom:16px">Minta Penawaran Pengiriman</h1>
      <p>Isi detail kargo dan rute pengiriman Anda. Tim Ambara akan meninjau kebutuhan tersebut dan menindaklanjutinya.</p>
    </div>

    <div class="card">
      <form id="quote-form">
        <div aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden">
          <label>Website URL</label>
          <input type="text" name="website_url" tabindex="-1" autocomplete="off">
        </div>
        <!-- Shipment Details -->
        <div style="font-family:var(--font-head);font-weight:800;font-size:1.125rem;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)">Detail Pengiriman</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label">Asal *</label>
            <input type="text" class="form-control" name="origin" required placeholder="Kota, Negara">
          </div>
          <div class="form-group">
            <label class="form-label">Tujuan *</label>
            <input type="text" class="form-control" name="destination" required placeholder="Kota, Negara">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label">Tanggal Kargo Siap *</label>
            <input type="date" class="form-control" name="readyDate" required>
          </div>
          <div class="form-group">
            <label class="form-label">Incoterms</label>
            <select class="form-control" name="incoterms">
              <option value="">Pilih Incoterms</option>
              <option>EXW</option><option>FCA</option><option>CPT</option><option>CIP</option>
              <option>DAP</option><option>DPU</option><option>DDP</option>
            </select>
          </div>
        </div>

        <!-- Cargo Info -->
        <div style="font-family:var(--font-head);font-weight:800;font-size:1.125rem;margin:24px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--border)">🏷️ Informasi Kargo</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label">Jenis Kargo *</label>
            <select class="form-control" name="cargoType" required id="cargo-type-select">
              <option value="">Pilih jenis</option>
              <option value="general">Kargo Umum</option>
              <option value="perishable">Kargo Mudah Rusak</option>
              <option value="dangerous_goods">Barang Berbahaya (DG)</option>
              <option value="consolidated">Pengiriman Konsolidasi</option>
            </select>
          </div>
          <div class="form-group" id="commodity-group">
            <label class="form-label">Komoditas</label>
            <input type="text" class="form-control" name="commodity" placeholder="Contoh: Elektronik, tekstil">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Deskripsi Kargo *</label>
          <textarea class="form-control" name="cargoDesc" required placeholder="Jelaskan jenis dan karakteristik kargo..." rows="3"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
          <div class="form-group">
            <label class="form-label">Berat (kg) *</label>
            <input type="number" class="form-control" name="weight" required placeholder="0.00" min="0.1" step="0.1">
          </div>
          <div class="form-group">
            <label class="form-label">Volume (CBM)</label>
            <input type="number" class="form-control" name="volume" placeholder="0.00" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Jumlah Koli</label>
            <input type="number" class="form-control" name="packages" placeholder="1" min="1">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label">Nilai Kargo (USD)</label>
            <input type="number" class="form-control" name="cargoValue" placeholder="0.00" step="0.01">
          </div>
          <div class="form-group">
            <label class="form-label">Asuransi Kargo</label>
            <select class="form-control" name="insurance">
              <option value="">Tidak diperlukan</option>
              <option value="all_risk">All Risk</option>
              <option value="basic">Perlindungan Dasar</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Kebutuhan Khusus</label>
          <input type="text" class="form-control" name="special" placeholder="Contoh: kontrol suhu, rapuh, ukuran besar">
        </div>

        <!-- Contact Info -->
        <div style="font-family:var(--font-head);font-weight:800;font-size:1.125rem;margin:24px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--border)">👤 Detail Kontak</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label">Nama Lengkap *</label>
            <input type="text" class="form-control" name="name" required autocomplete="name" placeholder="Nama Anda">
          </div>
          <div class="form-group">
            <label class="form-label">Perusahaan</label>
            <input type="text" class="form-control" name="company" autocomplete="organization" placeholder="Nama perusahaan">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" name="email" required autocomplete="email" placeholder="nama@perusahaan.com">
          </div>
          <div class="form-group">
            <label class="form-label">Telepon / WhatsApp *</label>
            <input type="tel" class="form-control" name="phone" required autocomplete="tel" placeholder="+62 812 3456 7890">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Catatan Tambahan</label>
          <textarea class="form-control" name="notes" placeholder="Informasi lain yang membantu kami menyiapkan penawaran..." rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="submit-btn">
          Kirim Permintaan Penawaran →
        </button>
        <div id="form-result" role="status" aria-live="polite" tabindex="-1" style="margin-top:16px"></div>
      </form>
    </div>
  </div>
</section>

<div id="footer-mount"></div>
<script src="/layout.js?v=2.4"></script>
<script src="/app.js?v=2.4"></script>
<script>
document.getElementById('navbar-mount').innerHTML = AMBARA.getNavbar('');
document.getElementById('footer-mount').innerHTML = AMBARA.getFooter();

// Hide commodity when consolidated
document.getElementById('cargo-type-select').addEventListener('change', function() {
  document.getElementById('commodity-group').style.opacity = this.value === 'consolidated' ? '0.4' : '1';
});

function escapeQuoteResult(value) {
  const span = document.createElement('span');
  span.textContent = String(value ?? '');
  return span.innerHTML;
}

document.getElementById('quote-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const result = document.getElementById('form-result');
  result.innerHTML = '';
  result.setAttribute('aria-busy', 'true');
  btn.disabled = true; btn.textContent = 'Mengirim...';

  const data = Object.fromEntries(new FormData(e.target));
  try {
    const res = await fetch('/api/submit-quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const json = await res.json().catch(() => ({}));
    if (res.ok) {
      const reference = escapeQuoteResult(json.reference || 'Menunggu');
      result.innerHTML = `<div class="card" style="background:rgba(0,229,160,0.1);border-color:rgba(0,229,160,0.2);text-align:center;padding:24px"><div style="font-size:1.5rem;margin-bottom:8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--blue-accent)"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div style="font-weight:700;color:var(--green);margin-bottom:8px">Permintaan Penawaran Diterima</div><div style="font-size:0.875rem;color:var(--text-muted)">Referensi: <strong style="color:var(--blue-accent)">${reference}</strong><br>Tim kami akan menindaklanjuti detail pengiriman Anda.</div></div>`;
      window.trackQuoteLead?.('id');
      e.target.reset();
    } else { throw new Error('quote_submission_failed'); }
  } catch {
    result.innerHTML = `<div class="card" style="background:rgba(255,68,102,0.1);border-color:rgba(255,68,102,0.2);color:var(--red);text-align:center;padding:16px">Formulir belum berhasil dikirim. Detail Anda tetap tersimpan di halaman ini—silakan coba lagi, kirim email ke <a href="mailto:cs@ambaraartha.com">cs@ambaraartha.com</a>, atau <a href="https://wa.me/6282125452800" target="_blank" rel="noopener">hubungi kami melalui WhatsApp</a>.</div>`;
  } finally {
    result.setAttribute('aria-busy', 'false');
    result.focus({ preventScroll: true });
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    btn.disabled = false; btn.textContent = 'Kirim Permintaan Penawaran →';
  }
});
</script>
</body>
</html>
